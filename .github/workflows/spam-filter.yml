name: AOL spam & phishing filter

on:
  schedule:
    # Each watcher stays on ~5h40m, checking the inbox every 5 minutes, and lines up
    # its own replacement the moment it starts, so there's no gap between them.
    # This schedule is only a backup that restarts the chain if it ever breaks.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be moved (don't move anything)"
        type: boolean
        default: true
      stay_on:
        description: "Keep running and check every 5 minutes for ~5h40m (instead of checking once)"
        type: boolean
        default: false
      lookback_days:
        description: "How many days of inbox to scan (use 60+ for a one-time cleanup)"
        type: number
        default: 7

concurrency:
  # Only one always-on watcher at a time; one-off manual checks run separately.
  group: ${{ (github.event_name == 'schedule' || inputs.stay_on) && 'spam-filter-watch' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # lets a watcher line up the next watcher

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Line up the next watcher
        # It waits in line (same concurrency group) and starts as soon as this one ends.
        if: github.event_name == 'schedule' || inputs.stay_on
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run spam-filter.yml --repo "$GITHUB_REPOSITORY" --ref main -f stay_on=true -f dry_run=false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -t .
      - name: Move spam to Junk
        env:
          IMAP_USER: ${{ secrets.AOL_EMAIL }}
          IMAP_PASSWORD: ${{ secrets.AOL_APP_PASSWORD }}
          IMAP_HOST: imap.aol.com
          LOOKBACK_DAYS: ${{ inputs.lookback_days || 7 }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          # Keep "0": this repo is public, so Actions logs are public. With 0 the
          # log only shows counts and the domains of junked spam, never your real
          # mail, subjects or who you've emailed.
          VERBOSE: "0"
          LOOP_MINUTES: ${{ (github.event_name == 'schedule' || inputs.stay_on) && '340' || '0' }}
          CHECK_EVERY: "5"
          PYTHONUNBUFFERED: "1"  # show each check in the log as it happens
        run: python spam_filter/run.py
